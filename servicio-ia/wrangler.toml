# Rocola de la Tierra — servicio de la guía por voz con IA (Cloudflare Workers, plan gratuito).
# AQUÍ NO VA LA CLAVE. La clave de Gemini se guarda como secreto con:  npx wrangler secret put GEMINI_API_KEY
# Todo lo de este archivo es público: se puede leer en GitHub sin riesgo.

name = "rocola-guia-ia"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Variables del servicio (no son secretas). Cámbialas aquí y vuelve a publicar con:  npx wrangler deploy
[vars]
# Páginas que pueden usar el servicio, separadas por comas, sin barra al final.
# misaelvayas-ui es el usuario de GitHub donde se publica la web. localhost es para probar en tu computadora.
ORIGENES_PERMITIDOS = "http://localhost:8000,http://localhost:8001,https://misaelvayas-ui.github.io"
# Modelo de Gemini. Nombre vigente comprobado el 14-nov-2026 en https://aistudio.google.com/docs/models
GEMINI_MODEL = "gemini-3.8-flash"
# Límites propios. Deben quedar POR DEBAJO de los de tu cuenta gratuita de Gemini,
# que se ven en https://aistudio.google.com/rate-limit (peticiones por minuto y por día del modelo).
MAX_POR_MINUTO_VISITANTE = "6"
MAX_POR_MINUTO_GLOBAL = "8"
MAX_POR_DIA = "200"
# Tamaños máximos, en caracteres.
MAX_TEXTO = "300"
MAX_CONTEXTO = "9000"

# El contador de los límites (un Durable Object con SQLite; funciona en el plan gratuito).
[[durable_objects.bindings]]
name = "CONTADOR"
class_name = "Contador"

[exports.Contador]
type = "durable-object"
storage = "sqlite"
